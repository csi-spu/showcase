name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main-branch commit SHA with existing GHCR images
        required: true
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: core
            dockerfile: apps/core/Dockerfile
          - app: admin
            dockerfile: apps/admin/Dockerfile
          - app: student
            dockerfile: apps/student/Dockerfile
          - app: visitor
            dockerfile: apps/visitor/Dockerfile
    uses: ./.github/workflows/build-image.yml
    with:
      app: ${{ matrix.app }}
      dockerfile: ${{ matrix.dockerfile }}
      source_sha: ${{ github.event.workflow_run.head_sha }}

  verify-source:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify full SHA belongs to main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "source_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

  verify-images:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-source
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        app: [core, admin, student, visitor]
    steps:
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable image exists
        env:
          APP: ${{ matrix.app }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/showcase-$APP:sha-$SOURCE_SHA"

  deploy-core:
    needs: [build, verify-images]
    if: >-
      always() &&
      vars.COOLIFY_STAGING_ENABLED == 'true' &&
      (needs.build.result == 'success' || needs.verify-images.result == 'success')
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      app: core
      application_uuid: ${{ vars.COOLIFY_STAGING_CORE }}
      environment: staging
      image_tag: sha-${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.workflow_run.head_sha }}
    secrets: inherit

  deploy-frontends:
    needs: [deploy-core, deploy-cache-worker]
    if: >-
      vars.COOLIFY_STAGING_ENABLED == 'true' &&
      needs.deploy-core.result == 'success' &&
      needs.deploy-cache-worker.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admin
            application_uuid: ${{ vars.COOLIFY_STAGING_ADMIN }}
          - app: student
            application_uuid: ${{ vars.COOLIFY_STAGING_STUDENT }}
          - app: visitor
            application_uuid: ${{ vars.COOLIFY_STAGING_VISITOR }}
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      app: ${{ matrix.app }}
      application_uuid: ${{ matrix.application_uuid }}
      environment: staging
      image_tag: sha-${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.workflow_run.head_sha }}
    secrets: inherit

  deploy-cache-worker:
    needs: deploy-core
    if: >-
      vars.COOLIFY_STAGING_ENABLED == 'true' &&
      needs.deploy-core.result == 'success'
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      app: core-cache-worker
      application_uuid: ${{ vars.COOLIFY_STAGING_CACHE_WORKER }}
      environment: staging
      image_tag: sha-${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.workflow_run.head_sha }}
    secrets: inherit
