name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Profile Consent and Work lifecycle browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: test
      E2E_LOCAL_ONLY: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the focused browser journey
        run: pnpm e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-lifecycle-diagnostics-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: Affected quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Check formatting
        run: pnpm format:check

      - name: Validate agent skills
        run: pnpm skills:check

      - name: Test agent skill validator
        run: pnpm skills:test

      - name: Lint affected packages
        run: pnpm turbo run lint --affected --concurrency=2

      - name: Typecheck affected packages
        run: pnpm turbo run typecheck --affected --concurrency=2

      - name: Test affected packages
        run: pnpm turbo run test:ci --affected --concurrency=2

      - name: Build affected packages
        run: pnpm turbo run build --affected --concurrency=2
