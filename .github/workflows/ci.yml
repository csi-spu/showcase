name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-e2e-scope:
    name: Select affected browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    outputs:
      specs: ${{ steps.select.outputs.specs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Select browser journeys
        id: select
        env:
          CHANGED_FILES_PATH: ${{ runner.temp }}/changed-files.txt
          TURBO_LS_PATH: ${{ runner.temp }}/turbo-affected.json
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TURBO_SCM_BASE" ] || [ "$TURBO_SCM_BASE" = "0000000000000000000000000000000000000000" ]; then
            specs="$(node tools/ci/select-browser-e2e.mjs --all)"
          else
            pnpm turbo ls --affected --output=json > "$TURBO_LS_PATH"
            git diff --name-only "$TURBO_SCM_BASE" "$TURBO_SCM_HEAD" > "$CHANGED_FILES_PATH"
            specs="$(node tools/ci/select-browser-e2e.mjs \
              --turbo-json "$TURBO_LS_PATH" \
              --changed-files "$CHANGED_FILES_PATH")"
          fi
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          jq . <<< "$specs"

  browser-e2e:
    name: Affected browser E2E
    needs: browser-e2e-scope
    if: needs.browser-e2e-scope.outputs.specs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: test
      E2E_LOCAL_ONLY: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the affected browser journeys
        env:
          SPECS: ${{ needs.browser-e2e-scope.outputs.specs }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t specs < <(jq -r '.[]' <<< "$SPECS")
          pnpm e2e "${specs[@]}"

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-lifecycle-diagnostics-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: Affected quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Check formatting
        run: pnpm format:check

      - name: Validate agent skills
        run: pnpm skills:check

      - name: Test agent skill validator
        run: pnpm skills:test

      - name: Test delivery workflow
        run: pnpm ci:workflow:test

      - name: Lint affected packages
        run: pnpm turbo run lint --affected --concurrency=2

      - name: Typecheck affected packages
        run: pnpm turbo run typecheck --affected --concurrency=2

      - name: Test affected packages
        run: pnpm turbo run test:ci --affected --concurrency=2

      - name: Build affected packages
        run: pnpm turbo run build --affected --concurrency=2

      - name: Create deployment plan
        if: github.event_name == 'push'
        env:
          PLAN_PATH: ${{ runner.temp }}/deployment-plan.json
          SOURCE_SHA: ${{ github.sha }}
          TURBO_DRY_RUN_PATH: ${{ runner.temp }}/turbo-build.json
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TURBO_SCM_BASE" ] || [ "$TURBO_SCM_BASE" = "0000000000000000000000000000000000000000" ]; then
            node tools/ci/create-deployment-plan.mjs \
              --source-sha "$SOURCE_SHA" \
              --output "$PLAN_PATH" \
              --all
          else
            pnpm turbo run build --filter="...[$TURBO_SCM_BASE]" --dry-run=json > "$TURBO_DRY_RUN_PATH"
            node tools/ci/create-deployment-plan.mjs \
              --source-sha "$SOURCE_SHA" \
              --output "$PLAN_PATH" \
              --turbo-json "$TURBO_DRY_RUN_PATH"
          fi
          jq . "$PLAN_PATH"

      - name: Upload deployment plan
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: deployment-plan
          path: ${{ runner.temp }}/deployment-plan.json
          if-no-files-found: error
          retention-days: 30
