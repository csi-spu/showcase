name: Build image

on:
  workflow_call:
    inputs:
      app:
        description: Application name used in the GHCR repository
        required: true
        type: string
      dockerfile:
        description: Dockerfile path from repository root
        required: true
        type: string
      source_sha:
        description: Full commit SHA to build
        required: true
        type: string
      sentry_dsn:
        description: Public runtime DSN; used only by browser applications at build time
        required: false
        type: string
        default: ''
      sentry_org:
        description: Sentry organization slug used for source-map upload
        required: true
        type: string
    secrets:
      SENTRY_AUTH_TOKEN:
        description: Sentry organization token used only during the image build
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          build-args: |
            GIT_SHA=${{ inputs.source_sha }}
            NEXT_PUBLIC_SENTRY_DSN=${{ inputs.sentry_dsn }}
            SENTRY_ORG=${{ inputs.sentry_org }}
            SENTRY_UPLOAD_SOURCE_MAPS=true
          secrets: |
            sentry-auth-token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ghcr.io/${{ github.repository_owner }}/showcase-${{ inputs.app }}:sha-${{ inputs.source_sha }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}
          provenance: mode=max
          sbom: true
