packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

disallowWorkspaceCycles: true
failIfNoMatch: true
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@scarf/scarf'
  - '@sentry/cli'
  - '@swc/core'
  - 'sharp'
  - 'unrs-resolver'
